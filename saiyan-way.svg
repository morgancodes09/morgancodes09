<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="The Saiyan Way">
<title>The Saiyan Way</title><desc>Values and capabilities that define the developer.</desc><defs><style>@font-face{font-family:'SaiyanDisplay';src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'SaiyanDisplay','Trebuchet MS',Arial,sans-serif;fill:#E8ECF5}.mono{font-family:'Courier New',monospace}.small{font-size:15px;letter-spacing:1.4px;fill:#9BA8C7}
.card{fill:#121829;stroke:#35405b;stroke-width:1.2}.enter{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes aura{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
</style>
<linearGradient id="gokuGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7A00"/><stop offset=".52" stop-color="#FFD60A"/><stop offset="1" stop-color="#FFC93C"/></linearGradient>
<linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF7A00" stop-opacity=".8"/><stop offset=".5" stop-color="#1E4BD8" stop-opacity=".7"/><stop offset="1" stop-color="#FFD60A" stop-opacity=".8"/></linearGradient>
<radialGradient id="auraGrad"><stop stop-color="#FFD60A" stop-opacity="0"/><stop offset=".72" stop-color="#FFC93C" stop-opacity=".16"/><stop offset="1" stop-color="#FF7A00" stop-opacity=".38"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8794b4" opacity=".16"/></pattern>
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clipCard"><rect width="1280" height="360" rx="28"/></clipPath></defs>
<rect width="1280" height="360" rx="28" fill="#0B0F1A"/><rect width="1280" height="360" rx="28" fill="url(#dots)"/><rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="url(#borderGrad)" stroke-width="2"/><g class="enter"><text x="58" y="70" font-size="17" fill="#FFD60A" letter-spacing="3">01 / THE SAIYAN WAY</text><text x="58" y="125" font-size="46" font-weight="900">Grow stronger with every build.</text><text x="60" y="160" font-size="17" fill="#9BA8C7">CSIT @ KIET • learning, experimenting and building practical software.</text><g transform="translate(60 205)"><rect width="350" height="112" rx="18" class="card"/><rect width="350" height="112" rx="18" fill="url(#dots)"/><text x="24" y="39" font-size="22" fill="#FF7A00" font-weight="800">01 — BUILD</text><text x="24" y="72" font-size="16">Web apps, Flutter apps and ML projects.</text><text x="24" y="94" font-size="13" fill="#9BA8C7">Small steps. Real outcomes.</text></g><g transform="translate(465 205)"><rect width="350" height="112" rx="18" class="card"/><rect width="350" height="112" rx="18" fill="url(#dots)"/><text x="24" y="39" font-size="22" fill="#FFD60A" font-weight="800">02 — LEARN</text><text x="24" y="72" font-size="16">DSA, Cloud, Deep Learning and Software Engineering.</text><text x="24" y="94" font-size="13" fill="#9BA8C7">Every challenge adds power.</text></g><g transform="translate(870 205)"><rect width="350" height="112" rx="18" class="card"/><rect width="350" height="112" rx="18" fill="url(#dots)"/><text x="24" y="39" font-size="22" fill="#65B9FF" font-weight="800">03 — SHARE</text><text x="24" y="72" font-size="16">Collaborate, document, improve.</text><text x="24" y="94" font-size="13" fill="#9BA8C7">Stronger teams. Better code.</text></g></g></svg>