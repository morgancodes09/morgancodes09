<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Saiyan Saga Missions — Abhay Singh's project showcase</title>
<desc id="desc">Five project cards in a dark Dragon Ball inspired orange, blue and gold interface.</desc>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A00"/><stop offset=".52" stop-color="#6E7BFF"/><stop offset="1" stop-color="#1E4BD8"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB347"/><stop offset="1" stop-color="#FF6500"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4EA5FF"/><stop offset="1" stop-color="#1E4BD8"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE680"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9FB4E8" opacity=".12"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .head{font:700 34px Arial,sans-serif;fill:#F5F7FF;letter-spacing:.5px}.sub{font:15px Arial,sans-serif;fill:#AAB7D5;letter-spacing:1.6px}.cardTitle{font:700 22px Arial,sans-serif;fill:#F5F7FF}.desc{font:15px Arial,sans-serif;fill:#C5CEE2}.tag{font:700 11px Arial,sans-serif;fill:#E9EEFF;letter-spacing:.8px}.num{font:700 16px Arial,sans-serif;fill:#10182A}.chip{font:600 12px Arial,sans-serif;fill:#E8EDFA}.label{font:700 10px Arial,sans-serif;fill:#8FA4CE;letter-spacing:1.5px}
  </style>
</defs>
<rect width="1280" height="760" rx="28" fill="#0B0F1A"/>
<rect width="1280" height="760" rx="28" fill="url(#dots)"/>
<rect x="2" y="2" width="1276" height="756" rx="27" fill="none" stroke="url(#border)" stroke-width="2" opacity=".9"/>
<circle cx="66" cy="63" r="22" fill="#FF7A00" opacity=".18" filter="url(#glow)"/><circle cx="66" cy="63" r="15" fill="none" stroke="#FFB347" stroke-width="2"/><g fill="#FFD60A"><path d="M61 55l2 4 4 1-4 2-2 4-2-4-4-2 4-1z"/><path d="M71 62l1.5 3 3 1-3 1.5-1.5 3-1.5-3-3-1.5 3-1z"/><path d="M60 68l1.2 2.4 2.5.8-2.5 1.2-1.2 2.5-1.2-2.5-2.5-1.2 2.5-.8z"/></g>
<text x="108" y="66" class="head">SAIYAN SAGA MISSIONS</text>
<text x="109" y="94" class="sub">PROJECTS BUILT • IDEAS TESTED • SKILLS LEVELLED UP</text>
<path d="M40 116H1240" stroke="url(#border)" stroke-width="1.5" opacity=".65"/>

<!-- Card 1 -->
<g transform="translate(40 140)">
 <rect width="585" height="220" rx="18" fill="#121A2B" stroke="#FF8A24" stroke-opacity=".8"/>
 <rect width="585" height="220" rx="18" fill="url(#dots)"/>
 <path d="M18 1H150" stroke="url(#orange)" stroke-width="3" filter="url(#glow)"/>
 <circle cx="43" cy="42" r="20" fill="url(#orange)"/><text x="43" y="48" text-anchor="middle" class="num">01</text>
 <text x="76" y="38" class="label">MACHINE LEARNING</text>
 <text x="76" y="66" class="cardTitle">Hospital Readmission Prediction</text>
 <text x="28" y="104" class="desc">Predicts patient readmission risk using supervised</text><text x="28" y="125" class="desc">machine-learning models.</text>
 <path d="M28 145H557" stroke="#34415D"/>
 <g transform="translate(28 162)"><rect width="62" height="28" rx="8" fill="#263A5E"/><text x="31" y="18" text-anchor="middle" class="chip">Python</text><rect x="70" width="124" height="28" rx="8" fill="#263A5E"/><text x="132" y="18" text-anchor="middle" class="chip">Logistic Reg.</text><rect x="202" width="113" height="28" rx="8" fill="#263A5E"/><text x="258" y="18" text-anchor="middle" class="chip">Random Forest</text><rect x="323" width="82" height="28" rx="8" fill="#263A5E"/><text x="364" y="18" text-anchor="middle" class="chip">XGBoost</text><rect x="413" width="55" height="28" rx="8" fill="#263A5E"/><text x="440" y="18" text-anchor="middle" class="chip">ANN</text></g>
</g>
<!-- Card 2 -->
<g transform="translate(655 140)">
 <rect width="585" height="220" rx="18" fill="#121A2B" stroke="#398BFF" stroke-opacity=".85"/>
 <rect width="585" height="220" rx="18" fill="url(#dots)"/>
 <path d="M18 1H150" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>
 <circle cx="43" cy="42" r="20" fill="url(#blue)"/><text x="43" y="48" text-anchor="middle" class="num">02</text>
 <text x="76" y="38" class="label">MOBILE APP • WEATHER</text>
 <text x="76" y="66" class="cardTitle">SkyPulse — AI-Powered Weather App</text>
 <text x="28" y="104" class="desc">A Flutter-based weather application with a focus</text><text x="28" y="125" class="desc">on accessible, easy-to-read weather information.</text>
 <path d="M28 145H557" stroke="#34415D"/>
 <g transform="translate(28 162)"><rect width="70" height="28" rx="8" fill="#263A5E"/><text x="35" y="18" text-anchor="middle" class="chip">Flutter</text><rect x="78" width="60" height="28" rx="8" fill="#263A5E"/><text x="108" y="18" text-anchor="middle" class="chip">Dart</text><rect x="146" width="142" height="28" rx="8" fill="#263A5E"/><text x="217" y="18" text-anchor="middle" class="chip">Weather UI</text></g>
</g>
<!-- Card 3 -->
<g transform="translate(40 390)">
 <rect width="585" height="220" rx="18" fill="#121A2B" stroke="#E9B83F" stroke-opacity=".85"/>
 <rect width="585" height="220" rx="18" fill="url(#dots)"/>
 <path d="M18 1H150" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
 <circle cx="43" cy="42" r="20" fill="url(#gold)"/><text x="43" y="48" text-anchor="middle" class="num">03</text>
 <text x="76" y="38" class="label">IOT • ASSISTIVE TECHNOLOGY</text>
 <text x="76" y="66" class="cardTitle">IoT-Based Blind Stick</text>
 <text x="28" y="104" class="desc">Sensor-based assistive navigation prototype</text><text x="28" y="125" class="desc">designed to help detect nearby obstacles.</text>
 <path d="M28 145H557" stroke="#34415D"/>
 <g transform="translate(28 162)"><rect width="48" height="28" rx="8" fill="#263A5E"/><text x="24" y="18" text-anchor="middle" class="chip">IoT</text><rect x="56" width="82" height="28" rx="8" fill="#263A5E"/><text x="97" y="18" text-anchor="middle" class="chip">Sensors</text></g>
</g>
<!-- Card 4 -->
<g transform="translate(655 390)">
 <rect width="585" height="220" rx="18" fill="#121A2B" stroke="#A77BFF" stroke-opacity=".85"/>
 <rect width="585" height="220" rx="18" fill="url(#dots)"/>
 <path d="M18 1H150" stroke="#A77BFF" stroke-width="3" filter="url(#glow)"/>
 <circle cx="43" cy="42" r="20" fill="#A77BFF"/><text x="43" y="48" text-anchor="middle" class="num">04</text>
 <text x="76" y="38" class="label">WEB DEVELOPMENT</text>
 <text x="76" y="66" class="cardTitle">Fitness Gym Web App</text>
 <text x="28" y="104" class="desc">A gym website interface focused on presenting</text><text x="28" y="125" class="desc">fitness services and a clean web experience.</text>
 <path d="M28 145H557" stroke="#34415D"/>
 <g transform="translate(28 162)"><rect width="55" height="28" rx="8" fill="#263A5E"/><text x="27" y="18" text-anchor="middle" class="chip">HTML</text><rect x="63" width="50" height="28" rx="8" fill="#263A5E"/><text x="88" y="18" text-anchor="middle" class="chip">CSS</text></g>
</g>
<!-- Card 5 -->
<g transform="translate(40 640)">
 <rect width="1200" height="82" rx="16" fill="#121A2B" stroke="#FF8A24" stroke-opacity=".7"/>
 <path d="M18 1H150" stroke="url(#orange)" stroke-width="3"/>
 <circle cx="43" cy="41" r="20" fill="url(#orange)"/><text x="43" y="47" text-anchor="middle" class="num">05</text>
 <text x="78" y="34" class="label">SUSTAINABILITY • SMART LIGHTING</text>
 <text x="78" y="59" class="cardTitle" font-size="19">Sustainable Light Management</text>
 <text x="590" y="47" class="desc">An energy-conscious lighting project for smarter resource use.</text>
 <rect x="1010" y="27" width="160" height="28" rx="8" fill="#332B1A" stroke="#B98B2E"/><text x="1090" y="45" text-anchor="middle" class="chip">TECH STACK TO ADD</text>
</g>
</svg>
